services:
  redis:
    image: redis:latest
    container_name: projem_redis
    ports:
      - "6379:6379"

  seq: #username: admin ; password: SeqAdminPass123!
    image: datalust/seq:latest
    container_name: projem_seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=SeqAdminPass123!
    ports:
      - "5341:80"
      - "5342:5341"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: projem_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - ELASTIC_PASSWORD=elasticpass
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: projem_kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=kibana123
    ports:
      - "5601:5601" #username: elastic ; password: elasticpass
    depends_on:
      - elasticsearch

  apm-server:
    image: docker.elastic.co/apm/apm-server:8.10.2
    container_name: projem_apm_server
    ports:
      - "8200:8200"
    command: >
      apm-server -e
      -E setup.kibana.host=kibana:5601
      -E apm-server.kibana.enabled=true
      -E apm-server.kibana.host=kibana:5601
      -E apm-server.kibana.ssl.enabled=false
      -E apm-server.kibana.ssl.verification_mode=none
      -E output.elasticsearch.hosts=["elasticsearch:9200"]
      -E output.elasticsearch.username=elastic
      -E output.elasticsearch.password=elasticpass
      -E apm-server.kibana.username=kibana_system
      -E apm-server.kibana.password=kibana123
    depends_on:
      - elasticsearch
      - kibana

  webapi:
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    container_name: projem_webapi
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ElasticApm__ServerUrl=http://apm-server:8200
      - ElasticApm__ServiceName=MyFinalProject_WebAPI
      - ElasticApm__Environment=Development
      - ElasticApm__LogLevel=Trace
    depends_on:
      redis:
        condition: service_started
      seq:
        condition: service_started
      apm-server:
        condition: service_started
      sqlserver:
        condition: service_healthy


  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: projem_sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=ProjeSifresi123!
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b > /dev/null'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  es_data:
  sql_data:


